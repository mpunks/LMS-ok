<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#3730a3" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Graduation Cap & Open Book Icon inside Safe Zone -->
  <g transform="translate(64, 64) scale(0.75)">
    <!-- Graduation Cap Top -->
    <polygon points="256,60 480,170 256,270 32,170" fill="#ffffff" />
    
    <!-- Cap Base -->
    <path d="M120,230 L120,330 C120,390 392,390 392,330 L392,230 L256,290 Z" fill="#e0e7ff" />
    
    <!-- Tassel -->
    <path d="M420,190 L450,280 C450,300 435,320 425,320 C415,320 410,300 415,280 L425,190" fill="url(#goldGrad)" />
    <circle cx="420" cy="180" r="14" fill="url(#goldGrad)" />

    <!-- Open Book Below Cap -->
    <g transform="translate(0, 150)">
      <path d="M256,230 C200,190 100,190 50,210 L50,360 C100,340 200,340 256,380 C312,340 412,340 462,360 L462,210 C412,190 312,190 256,230 Z" fill="#ffffff" />
      <line x1="256" y1="230" x2="256" y2="380" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round" />
      <line x1="90" y1="260" x2="220" y2="275" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" />
      <line x1="90" y1="295" x2="220" y2="310" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" />
      <line x1="292" y1="275" x2="422" y2="260" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" />
      <line x1="292" y1="310" x2="422" y2="295" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" />
    </g>
  </g>
</svg>
